services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitetrack
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
    cpus: 1.0
    mem_limit: 1g
    ports:
      - "5432:5432"
    volumes:
      - sitetrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    init: true
    environment:
      PORT: 3000
      DATABASE_URL: postgres://sitetrack:sitetrack@db:5432/sitetrack
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-before-deploying}
      JWT_TTL_DAYS: ${JWT_TTL_DAYS:-30}
      PGPOOL_MAX: 20
    cpus: 1.0
    mem_limit: 512m
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  sitetrack-db:
